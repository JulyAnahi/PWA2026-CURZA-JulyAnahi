services:
  django:
    image: tp2-backend:0.1
    build:
      context: ./config/django-image
    volumes:
      - ./src:/django/user/src/app:delegated
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - red


networks:
  red:
    driver: bridge 